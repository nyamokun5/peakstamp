<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PeakStamp | Whisper実験</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#091728;color:#eef5ff;margin:0;padding:22px;line-height:1.65}main{max-width:650px;margin:auto}a{color:#91d6ff}section{background:#13283e;border-radius:15px;padding:18px;margin:16px 0}button,input{font:inherit}button{padding:13px;border:0;border-radius:10px;background:#60d6b1;color:#071a25;font-weight:700}button:disabled{opacity:.4}input{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#adc2d1}</style></head>
<body><main><a href="./">← PeakStampへ戻る</a><h1>Whisper 音声認識テスト</h1><p>iPhone Safariで動くかを確かめる実験機能です。まずは30秒以下の短い動画・音声でお試しください。</p>
<section><label>動画または音声を選択<br><input id="file" type="file" accept="video/*,audio/*,.mp4,.mov,.m4a,.wav"></label><p><button id="run" disabled>日本語を文字起こし</button></p><small>初回はAIモデルをダウンロードします（数十MB以上）。Wi-Fi推奨。端末によってメモリ不足になる場合があります。音声はサーバーへ送信しませんが、モデルの取得にはネット接続が必要です。</small></section>
<section><strong>処理状況</strong><p id="status" role="status">ファイルを選択してください</p><strong>認識結果</strong><pre id="output">—</pre></section>
<script type="module">
const file=document.querySelector('#file'),run=document.querySelector('#run'),status=document.querySelector('#status'),output=document.querySelector('#output');
file.onchange=()=>{run.disabled=!file.files.length;status.textContent=file.files[0]?.name||'ファイルを選択してください'};
run.onclick=async()=>{
run.disabled=true;output.textContent='—';
try{
const f=file.files[0];if(!f)throw Error('ファイルがありません');
status.textContent='音声を読み込み中…';
const buffer=await f.arrayBuffer();
const context=new (window.AudioContext||window.webkitAudioContext)();
let audio;try{audio=await context.decodeAudioData(buffer)}finally{await context.close()}
const seconds=Math.min(audio.duration,30),sampleRate=16000;
if(!Number.isFinite(seconds)||seconds<=0)throw Error('音声を読み取れません');
status.textContent='音声を16kHzへ変換中…';
const offline=new OfflineAudioContext(1,Math.ceil(seconds*sampleRate),sampleRate);
const src=offline.createBufferSource();src.buffer=audio;src.connect(offline.destination);src.start(0,0,seconds);
const resampled=await offline.startRendering();
const samples=resampled.getChannelData(0);
status.textContent='Whisperモデルを読み込み中…（初回は時間がかかります）';
const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
env.allowLocalModels=false;
const transcriber=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny',{dtype:'q8',device:'wasm',progress_callback:p=>{if(p.status==='progress'&&p.progress!=null)status.textContent='モデル取得中 '+Math.round(p.progress)+'%'}});
status.textContent='文字起こし中…';
const result=await transcriber(samples,{language:'japanese',task:'transcribe',chunk_length_s:30,return_timestamps:true});
output.textContent=JSON.stringify(result,null,2);
status.textContent='完了（冒頭最大30秒）';
}catch(e){status.textContent='失敗: '+(e?.message||String(e))+'。iPhoneでMOVが読めない場合は短いM4A/WAVで試してください。'}
finally{run.disabled=false}
};
</script></main></body></html>
