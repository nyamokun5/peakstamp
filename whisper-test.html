<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PeakStamp | Whisper実験</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#091728;color:#eef5ff;margin:0;padding:22px;line-height:1.65}main{max-width:650px;margin:auto}a{color:#91d6ff}section{background:#13283e;border-radius:15px;padding:18px;margin:16px 0}button,input{font:inherit}button{padding:13px;border:0;border-radius:10px;background:#60d6b1;color:#071a25;font-weight:700}button:disabled{opacity:.4}input{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#adc2d1}</style></head>
<body><main><a href="./">← PeakStampへ戻る</a><h1>Whisper 音声認識テスト</h1><p>iPhone Safariで動くかを確かめる実験機能です。まずは会話や掛け声のある10秒間を指定してお試しください。</p>
<section>
<label>動画または音声を選択<br><input id="file" type="file" accept="video/*,audio/*,.mp4,.mov,.m4a,.wav"></label>
<p><label>解析開始（秒） <input id="start" type="number" min="0" step="1" value="0" style="width:90px;background:#eff7ff;color:#10283a;border:0;border-radius:7px;padding:9px"></label></p>
<p><label>解析する長さ <select id="length" style="padding:9px;border-radius:7px"><option value="10" selected>10秒（おすすめ）</option><option value="15">15秒</option><option value="30">30秒</option></select></label></p>
<p><label>音声認識モデル <select id="model" style="padding:9px;border-radius:7px"><option value="tiny">Tiny（軽量・現在のモデル）</option><option value="base" selected>Base（精度優先・処理が重い）</option></select></label></p>
<p><label><input id="compat" type="checkbox"> MOV互換モード（動画を再生しながら音声を取得）</label></p>
<p><video id="mediaPreview" controls playsinline preload="metadata" style="width:100%;max-height:230px;border-radius:10px;background:#000" hidden></video></p>
<p><button id="run" disabled>日本語を文字起こし</button></p>
<small>まずは掛け声のある10秒を指定してください。MOVでは互換モードを自動選択します。互換モードでは動画を実時間で再生して音声を取り出すため、約10〜30秒必要です。Baseの初回実行ではモデル取得が必要です。音声データは外部サーバーに送信しません。</small>
</section>
<section><strong>処理状況</strong><p id="status" role="status">ファイルを選択してください</p><strong>認識結果</strong><p id="quality" aria-live="polite"></p><pre id="output">—</pre><details><summary>認識結果の詳細（確認用）</summary><pre id="raw">—</pre></details></section>
<script type="module">
const $=id=>document.getElementById(id);
const file=$('file'),run=$('run'),status=$('status'),output=$('output'),quality=$('quality'),raw=$('raw'),compat=$('compat'),preview=$('mediaPreview');
let objectURL=null,mediaContext=null,mediaNode=null;
let loadedPipe=null,loadedModel='';
file.onchange=()=>{
  run.disabled=!file.files.length;
  const f=file.files[0];
  status.textContent=f?.name||'ファイルを選択してください';
  quality.textContent='';output.textContent='—';raw.textContent='—';
  preview.pause();preview.removeAttribute('src');preview.load();
  if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null;}
  if(f){
    objectURL=URL.createObjectURL(f);
    preview.src=objectURL;preview.hidden=false;preview.load();
    compat.checked=/\\.mov$/i.test(f.name)||/quicktime/i.test(f.type);
    if(compat.checked)status.textContent='MOVファイルを選択しました。互換モードで動画を読み込み中…';
  }else preview.hidden=true;
};
const repetitive=text=>{
  const compact=(text||'').replace(/\s/g,'');
  if(/(.)\1{11,}/u.test(compact))return true;
  if(/(.{2,6}?)\1{7,}/u.test(compact))return true;
  if(compact.length>70 && new Set([...compact]).size / [...compact].length <0.14)return true;
  return false;
};
const fmtSec=sec=>Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');
// Safari sometimes plays MOV even when decodeAudioData cannot open the container.
// Capture the selected region in real time through the media element's Web Audio output.
async function captureFromMedia(start,length){
  if(preview.readyState<1||!Number.isFinite(preview.duration)){
    throw Error('MOVの読み込みがまだ終わっていません。数秒待って再度押してください');
  }
  if(start>=preview.duration)throw Error('開始位置が動画の長さを超えています（約'+Math.floor(preview.duration)+'秒）');
  const seconds=Math.min(length,preview.duration-start);
  if(seconds<0.5)throw Error('指定した位置に音声がありません');
  if(!window.AudioContext&&!window.webkitAudioContext)throw Error('Web Audio非対応のブラウザです');
  if(!mediaContext){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    mediaContext=new Ctx();
    mediaNode=mediaContext.createMediaElementSource(preview);
  }
  const ctx=mediaContext;
  const maxFrames=Math.ceil(seconds*ctx.sampleRate);
  const recording=new Float32Array(maxFrames);
  let filled=0;
  const processor=ctx.createScriptProcessor(4096,2,1);
  const silence=ctx.createGain();silence.gain.value=0;
  mediaNode.connect(processor);processor.connect(silence);silence.connect(ctx.destination);
  preview.pause();
  preview.currentTime=start;
  status.textContent='MOV互換モード：動画を再生して音声取得中（約'+Math.ceil(seconds)+'秒）…';
  const recorded=await new Promise((resolve,reject)=>{
    let settled=false, timer=null;
    const cleanup=()=>{
      clearTimeout(timer);
      processor.onaudioprocess=null;
      preview.removeEventListener('ended',onEnded);
      preview.removeEventListener('error',onError);
      preview.pause();
      try{mediaNode.disconnect(processor);processor.disconnect();silence.disconnect();}catch(_){}
    };
    const finish=error=>{
      if(settled)return;
      settled=true;cleanup();
      if(error)reject(error);
      else if(filled<ctx.sampleRate*0.4)reject(Error('動画から音声を取得できませんでした。SafariのMOV形式が非対応の可能性があります'));
      else resolve(recording.slice(0,filled));
    };
    const onEnded=()=>finish();
    const onError=()=>finish(Error('動画を再生できません（MOVの映像・音声形式を確認してください）'));
    preview.addEventListener('ended',onEnded);
    preview.addEventListener('error',onError);
    processor.onaudioprocess=event=>{
      if(settled||preview.paused||preview.seeking||preview.currentTime<start-0.25)return;
      const input=event.inputBuffer;
      const left=input.getChannelData(0);
      const right=input.numberOfChannels>1?input.getChannelData(1):left;
      const n=Math.min(left.length,maxFrames-filled);
      for(let i=0;i<n;i++)recording[filled+i]=(left[i]+right[i])*0.5;
      filled+=n;
      if(filled>=maxFrames || preview.currentTime>=start+seconds-0.07)finish();
    };
    timer=setTimeout(()=>finish(Error('音声取得がタイムアウトしました。動画が再生されているか確認してください')),Math.ceil((seconds+12)*1000));
    // Invoke play() and resume() in the same click task for iPhone gesture gating.
    const resumed=ctx.resume();
    resumed.catch(err=>finish(Error('音声処理を開始できません: '+err.message)));
    const playing=preview.play();
    if(playing?.catch)playing.catch(err=>finish(Error('動画再生がブロックされました: '+err.message)));
  });
  const rate=16000;
  const offline=new OfflineAudioContext(1,Math.max(1,Math.floor(recorded.length*rate/ctx.sampleRate)),rate);
  const audio=offline.createBuffer(1,recorded.length,ctx.sampleRate);
  audio.copyToChannel(recorded,0);
  const src=offline.createBufferSource();src.buffer=audio;src.connect(offline.destination);src.start();
  const rendered=await offline.startRendering();
  return {samples:rendered.getChannelData(0),seconds:recorded.length/ctx.sampleRate,source:'MOV互換モード'};
}

run.onclick=async()=>{
  run.disabled=true;output.textContent='—';raw.textContent='—';quality.textContent='';
  try{
    const f=file.files[0];if(!f)throw Error('ファイルを選択してください');
    const start=Math.max(0,Number($('start').value)||0);
    const length=Number($('length').value);
    const model=$('model').value;
    if(!Number.isFinite(start)||start<0)throw Error('開始位置を確認してください');
    let samples,seconds,sourceMode='通常モード';
    if(compat.checked){
      ({samples,seconds,source:sourceMode}=await captureFromMedia(start,length));
    }else{
      status.textContent='音声を読み込み中…（動画全体の読み込みには時間がかかることがあります）';
      const buffer=await f.arrayBuffer();
      const context=new (window.AudioContext||window.webkitAudioContext)();
      let audio;
      try{audio=await context.decodeAudioData(buffer)}
      catch(e){
        compat.checked=true;
        throw Error('直接デコードに失敗しました。MOV互換モードをONにしたので、もう一度「日本語を文字起こし」を押してください');
      }finally{await context.close()}
      if(start>=audio.duration)throw Error('開始位置が動画の長さを超えています（動画は約'+Math.floor(audio.duration)+'秒）');
      seconds=Math.min(length,audio.duration-start);
      if(!Number.isFinite(seconds)||seconds<0.5)throw Error('指定した区間に音声がありません');
      status.textContent='指定した区間を16kHzに変換中…';
      const rate=16000;
      const offline=new OfflineAudioContext(1,Math.max(1,Math.floor(seconds*rate)),rate);
      const src=offline.createBufferSource();src.buffer=audio;src.connect(offline.destination);src.start(0,start,seconds);
      const rendered=await offline.startRendering();
      samples=rendered.getChannelData(0);
    }
    let energy=0;
    for(let i=0;i<samples.length;i++) energy+=samples[i]*samples[i];
    const rms=Math.sqrt(energy/samples.length);
    raw.textContent='方式: '+sourceMode+'\n区間: '+fmtSec(start)+'〜'+fmtSec(start+seconds)+'\n音量RMS: '+rms.toFixed(4);
    if(rms<0.002){
      quality.textContent='音量が非常に小さい区間です。声が聞こえる位置に開始時間を変更してください。';
      output.textContent='音声を認識できませんでした。';
      status.textContent='完了（無音に近い区間のため文字起こしを省略）';
      return;
    }
    status.textContent='Whisperモデル準備中…（初回はダウンロードが必要です）';
    const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
    env.allowLocalModels=false;
    if(!loadedPipe || loadedModel!==model){
      if(loadedPipe){await loadedPipe.dispose();loadedPipe=null;loadedModel=''}
      loadedPipe=await pipeline('automatic-speech-recognition','onnx-community/whisper-'+model,{
        dtype:'q8',device:'wasm',
        progress_callback:p=>{
          if(p.status==='progress'&&Number.isFinite(p.progress))
            status.textContent='モデル取得中 '+Math.round(p.progress)+'%';
        }
      });
      loadedModel=model;
    }
    status.textContent='日本語を認識中…';
    const started=performance.now();
    const result=await loadedPipe(samples,{
      language:'japanese',
      task:'transcribe',
      return_timestamps:true,
      chunk_length_s:30,
      max_new_tokens:128
    });
    const text=(result.text||'').trim();
    const isRepeat=repetitive(text);
    const tooLong=text.length>Math.max(120,Math.floor(seconds*16));
    raw.textContent='方式: '+sourceMode+'\nモデル: '+model+'\n区間: '+fmtSec(start)+'〜'+fmtSec(start+seconds)+'\n処理時間: '+Math.round((performance.now()-started)/1000)+'秒\n音量RMS: '+rms.toFixed(4)+'\n'+JSON.stringify(result,null,2).slice(0,4500);
    if(!text){
      quality.textContent='言葉を認識できませんでした。';
      output.textContent='（認識できる発話なし）';
    }else if(isRepeat || tooLong){
      quality.textContent='⚠ 異常に長い繰り返しを検出しました。誤認識の可能性が高いため、ハイライト判定には使用しません。';
      output.textContent='（繰り返しの多い認識結果を除外しました）';
    }else{
      quality.textContent='候補として認識されました。実際の声と一致するか確認してください。';
      output.textContent=text;
      if(Array.isArray(result.chunks)){
        const lines=result.chunks.map(c=>{
          const t=Array.isArray(c.timestamp)?c.timestamp[0]:0;
          return '['+fmtSec(start+Math.max(0,t||0))+'] '+(c.text||'').trim();
        }).filter(Boolean);
        if(lines.length)output.textContent=lines.join('\n');
      }
    }
    status.textContent='完了（'+fmtSec(start)+'〜'+fmtSec(start+seconds)+' / '+model+'）';
  }catch(e){
    status.textContent='失敗: '+(e?.message||String(e));
    quality.textContent='MOVの場合は互換モードで再試行してください。互換モードでも失敗する場合は音声形式を確認してください。';
  }finally{run.disabled=false}
};
</script></main></body></html>
