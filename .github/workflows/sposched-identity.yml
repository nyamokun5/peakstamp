name: SpoSched identity regression
on:
  pull_request:
    paths:
      - 'sposched-analysis-identity.mjs'
      - 'sposched-alias-auto-match.mjs'
      - 'tests/sposched-waiting-identity.test.mjs'
      - '.github/workflows/sposched-identity.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Waiting-fixture identity regression
        run: node --test tests/sposched-waiting-identity.test.mjs
