name: PeakStamp tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.mjs
          node --check detector.mjs
          node --check exporter.mjs
          node --check montage-ui.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs

  finish-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for isolated TEST-only UI regression
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Exercise final-score confirmation and bracket refresh
        run: |
          node scripts/test-finish-browser.mjs
          node scripts/test-auto-tournament-browser.mjs
          node scripts/test-goal-review-browser.mjs
          node scripts/test-helper-browser.mjs
          node scripts/test-bridge-tab-browser.mjs
          node scripts/test-worker-batch-browser.mjs
          TEST_FINAL_SNAPSHOT_FAILURE=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 TEST_PAUSE_LOST_REPLY=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 TEST_PAUSE_RELOAD=1 node scripts/test-worker-batch-browser.mjs
          TEST_RUNNING_RELOAD=1 node scripts/test-worker-batch-browser.mjs
          TEST_RUNNING_RELOAD=1 TEST_CANCEL_RUNNING_CONTINUE=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 TEST_RESUME_LOST_REPLY=1 node scripts/test-worker-batch-browser.mjs
          node scripts/test-worker-recreated-browser.mjs
          node scripts/test-reset-bracket-bulk-browser.mjs
          TEST_RESET_BULK_CANCEL=1 node scripts/test-reset-bracket-bulk-browser.mjs
          node scripts/test-pending-recovery-browser.mjs
          node scripts/test-retired-match-browser.mjs
          node scripts/test-ss-connection-race-browser.mjs
