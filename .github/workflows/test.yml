name: PeakStamp tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.mjs
          node --check detector.mjs
          node --check exporter.mjs
          node --check montage-ui.mjs
      - name: Unit tests
        run: |
          node --test tests/*.test.mjs *.test.mjs
          node --test scripts/test-name-resolution.mjs scripts/test-goal-identity-gate.mjs scripts/test-alias-proposal.mjs scripts/test-alias-submission.mjs scripts/test-goal-alias-learning.mjs scripts/test-score-reconciliation.mjs
          node --test scripts/test-snapshot-member-resolver.mjs scripts/test-simple-name-choice.mjs scripts/test-goal-selection-draft.mjs scripts/test-minimal-goal-fix.mjs

  finish-browser:
    # Playwright 1.51.1 does not support the ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for isolated TEST-only UI regression
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Install mobile UI fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Exercise final-score confirmation and bracket refresh
        run: |
          node scripts/test-analysis-names-browser.mjs
          TEST_PRODUCTION_ANALYSIS=1 node scripts/test-analysis-names-browser.mjs
          node scripts/test-waiting-goal-player-browser.mjs
          node scripts/test-production-inline-browser.mjs
          node scripts/test-highlight-history-browser.mjs
          node scripts/test-focused-highlights-browser.mjs
          node scripts/test-youtube-mirror-browser.mjs
          node scripts/test-youtube-shared-browser.mjs
          node scripts/test-shared-youtube-goal-browser.mjs
          node scripts/test-youtube-watch-controls-browser.mjs
          node scripts/test-inline-decision-browser.mjs
          node scripts/test-minimal-ui-browser.mjs
          node scripts/test-manual-direct-browser.mjs
          node scripts/test-simple-results-browser.mjs
          node scripts/test-alias-learning-browser.mjs
          node scripts/test-one-tap-alias-browser.mjs
          TEST_ALIAS_RACE=1 node scripts/test-alias-learning-browser.mjs
          node scripts/test-minimal-goal-fix-browser.mjs
          node scripts/test-finish-browser.mjs
          node scripts/test-auto-tournament-browser.mjs
          node scripts/test-goal-review-browser.mjs
          node scripts/test-helper-browser.mjs
          node scripts/test-bridge-tab-browser.mjs
          node scripts/test-worker-batch-browser.mjs
          TEST_FINAL_SNAPSHOT_FAILURE=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 TEST_PAUSE_LOST_REPLY=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 TEST_PAUSE_RELOAD=1 node scripts/test-worker-batch-browser.mjs
          TEST_RUNNING_RELOAD=1 node scripts/test-worker-batch-browser.mjs
          TEST_RUNNING_RELOAD=1 TEST_CANCEL_RUNNING_CONTINUE=1 node scripts/test-worker-batch-browser.mjs
          TEST_BATCH_PAUSE=1 TEST_RESUME_LOST_REPLY=1 node scripts/test-worker-batch-browser.mjs
          node scripts/test-worker-recreated-browser.mjs
          node scripts/test-reset-bracket-bulk-browser.mjs
          TEST_RESET_BULK_CANCEL=1 node scripts/test-reset-bracket-bulk-browser.mjs
          node scripts/test-pending-recovery-browser.mjs
          node scripts/test-retired-match-browser.mjs
          node scripts/test-ss-connection-race-browser.mjs
          node scripts/test-production-gate-browser.mjs
          TEST_SIMPLE_PRODUCTION=1 node scripts/test-production-gate-browser.mjs
          node scripts/test-staging-site-browser.mjs
          node scripts/test-variable-fixtures-browser.mjs
