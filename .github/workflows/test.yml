name: PeakStamp tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.mjs
          node --check detector.mjs
          node --check exporter.mjs
          node --check montage-ui.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
