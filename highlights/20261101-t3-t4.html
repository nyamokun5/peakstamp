<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>11/1 チーム3 vs チーム4｜Shoot Sunday</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1729;color:#f8fafc;font:16px/1.5 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px 12px 48px}header{color:#82e2d6;font-weight:700;letter-spacing:.08em}h1{font-size:clamp(23px,5vw,34px);margin:6px 0 12px}.screen{aspect-ratio:16/9;background:#000}.screen iframe{width:100%;height:100%;border:0}.controls{flex-wrap:wrap;display:flex;align-items:center;gap:12px;margin:14px 0}button{font:inherit;cursor:pointer;border:0}#play{padding:10px 15px;border-radius:8px;background:#8be7d9;font-weight:700}#pause{padding:10px;border-radius:8px;background:#243850;color:white}#status{color:#c8d7e8;font-size:14px}ol{padding:0;list-style:none}li button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;padding:13px 12px;background:#14243a;color:white;border-bottom:1px solid #304057}li button[aria-current=true]{background:#224957}time{color:#bdd0df;font:14px monospace}a{color:#a8d9ff}.goal{color:#93f0c0}

@media (max-width: 720px) and (orientation: portrait) {
 .screen { margin-inline: -12px; }
}

 main { max-width: none; padding: 0 0 24px; }
 main > header, main > h1 { display: none; }
 .screen { width: 100%; height: 100vh; height: 100dvh; background: black; }
 .controls, ol, main > a { margin-inline: 16px; }
}
#expand{padding:10px 14px;border-radius:8px;background:#243850;color:white}
body.viewing{overflow:hidden}
#viewer.expanded{position:fixed;inset:0;z-index:10;width:100%;height:100vh;height:100dvh;background:black;display:flex;flex-direction:column}

@media (orientation:landscape) and (max-height:600px){#viewer:not(.expanded) .screen{height:calc(100dvh - 60px)}}
.viewer-layout { display: contents; }

 #viewer.expanded .viewer-layout {
  position: absolute;
  top: 0;
  left: 100%;

 }

 grid-template-columns:minmax(0,1fr) clamp(96px,14%,132px);

</style><main><header>SHOOT SUNDAY</header><h1>11月1日　チーム3 vs チーム4</h1><section id="viewer"><div class="viewer-layout"><div class="screen"><div id="player"></div></div><div class="controls"><button id="play" disabled>▶ 9場面を連続再生</button><button id="pause" hidden>一時停止</button><button id="expand" aria-pressed="false">⛶ 全画面</button><span id="status" role="status">読み込み中…</span></div></div></section><ol id="list"></ol><a href="https://youtu.be/rhnm1ZzCVMU">YouTubeでフル試合を見る ↗</a></main>
<script>
const viewer=document.querySelector('#viewer');
const expand=document.querySelector('#expand');
const usePageFullscreen=navigator.maxTouchPoints>0;
function showExpanded(enabled){
 viewer.classList.toggle('expanded',enabled);
 document.body.classList.toggle('viewing',enabled);
 expand.textContent=enabled?'全画面を終了':'⛶ 全画面';
 expand.setAttribute('aria-pressed',String(enabled));
}
expand.onclick=async()=>{
 if(viewer.classList.contains('expanded')){
  if(document.fullscreenElement===viewer)await document.exitFullscreen();
  showExpanded(false);
  return;
 }
 showExpanded(true);
 if(!usePageFullscreen && viewer.requestFullscreen){
  try{await viewer.requestFullscreen()}catch{/* Keep the viewport-sized layout. */}
 }
};
document.addEventListener('fullscreenchange',()=>{
 if(!usePageFullscreen)showExpanded(document.fullscreenElement===viewer);
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!document.fullscreenElement)showExpanded(false);
});
const scenes=[
 [94,105,'ナイスキー'],[110,118,'惜しいシュート'],[137,147,'抜け出しからシュート'],
 [165,179,'トラップからシュート'],[212,222,'中央からシュート'],[225,240,'チャンスからシュート'],
 [280,295,'ゴール際の攻防'],[320,338,'⚽ ゴール'],[363,377,'⚽ ゴール']
];
const videoId='rhnm1ZzCVMU';
const play=document.querySelector('#play'),statusText=document.querySelector('#status');
let player,index=0,active=false,seeking=false,started=false;
function clock(seconds){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
const buttons=scenes.map(([start,end,title],i)=>{
 const li=document.createElement('li'),b=document.createElement('button');
 b.disabled=true;b.innerHTML='<time>'+clock(start)+'–'+clock(end)+'</time><span>'+title+'</span>';
 if(i>=7)b.className='goal';
 b.onclick=()=>jump(i);li.append(b);document.querySelector('#list').append(li);return b;
});
function jump(i){
 index=i;active=true;started=true;seeking=true;
 buttons.forEach((b,n)=>b.setAttribute('aria-current',String(i===n)));
 play.textContent='最初から再生';statusText.textContent=(i+1)+' / 9　'+scenes[i][2];
 const alreadyPlaying=player.getPlayerState()===YT.PlayerState.PLAYING;
 player.seekTo(scenes[i][0],true);
 if(!alreadyPlaying)player.playVideo();
}
play.onclick=()=>jump(0);
const pause=document.querySelector('#pause');
pause.onclick=()=>{
 if(player.getPlayerState()===2)player.playVideo();
 else player.pauseVideo();
};
window.onYouTubeIframeAPIReady=()=>{
 player=new YT.Player('player',{videoId,playerVars:{controls:new URLSearchParams(location.search).has("youtubeControls")?1:0,fs:1,playsinline:1,start:scenes[0][0],origin:location.origin},
 events:{onReady:()=>{play.disabled=false;buttons.forEach(b=>b.disabled=false);statusText.textContent='全9場面';},
 onStateChange:e=>{
  if(e.data===1&&!started)jump(0);
  pause.hidden=!active;
  pause.textContent=e.data===2?'再開':'一時停止';
 },
 onAutoplayBlocked:()=>{statusText.textContent='動画内の ▶ をタップしてください'},
 onError:()=>{active=false;statusText.textContent='埋め込み再生エラー。下のリンクからフル試合を開けます。'}}});
};
setInterval(()=>{
 if(!active||player.getPlayerState()!==1)return;
 const now=player.getCurrentTime(),[start,end]=scenes[index];
 if(seeking){if(now>=start-1&&now<end)seeking=false;return}
 if(now<end)return;
 if(index+1<scenes.length)jump(index+1);
 else{active=false;player.pauseVideo();statusText.textContent='全9場面の再生が終了しました';}
},150);
</script><script src="https://www.youtube.com/iframe_api"></script></html>
